[project]
name = "quicksimsbio"
version = "0.1.0"
description = "A lightweight python package to use quasi random sampling easily with basico."
authors = [
    {name = "Theo-BRN",email = "theobrn@live.co.uk"}
]
requires-python = ">=3.12"
dependencies = [
    "numpy (>=2.4.4,<3.0.0)",
    "scipy (>=1.17.1,<2.0.0)",
    "pandas (>=3.0.2,<4.0.0)",
    "copasi-basico (>=0.86,<0.87)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "quicksimsbio"
version = "0.1.0"
description = "A lightweight python package to use quasi random sampling easily with basico."
authors = ["Theo-BRN <theobrn@live.co.uk>"]
packages = [
    { include = "quicksimsbio", from = "src" }
]
[dependency-groups]
dev = [
    "pytest (>=9.1.0,<10.0.0)"
]
